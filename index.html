<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratoire des défaillances du marché | EFREI</title><style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#13253d;--muted:#566b83;--navy:#102b4d;--blue:#2478d1;--teal:#087f77;--orange:#dc8c22;--red:#d34b5c;--line:#dbe4ef;--shadow:0 8px 28px #16345713}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #80bafa;outline-offset:2px}.top{background:var(--navy);color:white;padding:17px max(22px,calc((100vw - 1260px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-weight:800;font-size:19px}.brand small{display:block;color:#b9cfe8;font-weight:400;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button,.ghost{background:#ffffff16;color:white;border:1px solid #ffffff55;border-radius:9px;padding:7px 11px}.toolbar button.active{background:white;color:var(--navy)}main{max-width:1260px;margin:auto;padding:28px 20px 65px}.hero{background:linear-gradient(120deg,#112f55,#176e83);color:white;padding:30px;border-radius:20px;box-shadow:var(--shadow);margin-bottom:22px}.hero h1{font-size:clamp(25px,3vw,37px);line-height:1.2;margin:5px 0 10px}.hero p{max-width:800px;color:#e0edf5;margin:0}.eyebrow{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:#a8e2e3}.sectiontitle{margin:26px 0 12px;font-size:21px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.family{background:var(--card);border:1px solid var(--line);padding:19px;border-radius:15px;text-align:left;box-shadow:var(--shadow);color:var(--ink);min-height:165px}.family:hover,.scenario:hover{border-color:var(--blue);transform:translateY(-2px)}.family strong{display:block;font-size:18px;margin:8px 0}.family span{color:var(--muted);font-size:13px}.family .emoji{font-size:28px}.scenario-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.scenario{background:white;border:1px solid var(--line);border-radius:13px;padding:16px;text-align:left;color:var(--ink);transition:.15s}.scenario strong{display:block}.scenario span{color:var(--muted);font-size:13px}.pill{font-size:12px;font-weight:800;border-radius:20px;background:#e3f1ff;color:#1b5486;padding:4px 10px;display:inline-block}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px;align-items:start}.side{background:white;border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:12px}.side button{display:block;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:11px;border-radius:9px;font-size:13px}.side button.active{background:#e9f3fd;font-weight:800;color:#155d9b}.workspace{min-width:0}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:23px;box-shadow:var(--shadow);margin-bottom:15px}.panel h2{margin:4px 0 8px;font-size:25px}.panel h3{margin:0 0 9px;font-size:18px}.muted{color:var(--muted)}.steps{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.steps button{border:1px solid var(--line);background:#f6f9fd;border-radius:10px;padding:10px 12px;color:var(--ink);font-size:13px}.steps button.active{background:#153e69;color:white}.question{font-size:18px;font-weight:750;margin:14px 0}.choices{display:grid;gap:9px}.choice{border:1px solid var(--line);background:#f8fafd;padding:12px;text-align:left;border-radius:10px;color:var(--ink)}.choice.selected{border-color:var(--blue);background:#e8f3ff}.choice.correct{border-color:var(--teal);background:#e6f7f1}.choice.wrong{border-color:var(--red);background:#ffedef}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.btn{border:0;border-radius:10px;padding:10px 16px;background:#1768b2;color:white;font-weight:700}.btn.secondary{background:#e9f1f9;color:#204f78}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{padding:13px 15px;background:#edf7f5;border-left:4px solid var(--teal);border-radius:8px;margin-top:12px}.warning{background:#fff5e7;border-left-color:var(--orange)}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.control{background:#f5f8fc;border:1px solid var(--line);padding:13px;border-radius:11px}.control label{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}.control input[type=range]{width:100%;accent-color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{padding:13px;border-radius:11px;background:#f0f5fa}.stat b{display:block;font-size:22px;color:#0e4d80}.stat small{font-size:12px;color:var(--muted)}.chart{width:100%;height:auto;max-height:340px;background:#fbfdff;border:1px solid var(--line);border-radius:12px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:7px 0}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:5px}.note{font-size:12px;color:var(--muted);margin-top:12px}.glossary{margin-top:18px;background:#f5f9ff;border:1px solid var(--line);border-radius:12px;padding:13px 16px}.glossary summary{cursor:pointer;font-weight:800;color:#174c79}.glossary dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:13px 0 0}.glossary dt{font-weight:800}.glossary dd{margin:2px 0 0;color:var(--muted);font-size:13px}@media(max-width:650px){.glossary dl{grid-template-columns:1fr}}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#f4f8fc;border-radius:11px;padding:14px}.mini b{display:block;margin-bottom:5px}.progress{height:7px;background:#e4eaf1;border-radius:10px;overflow:hidden}.progress div{height:100%;background:var(--teal)}.back{background:transparent;border:0;color:#1768b2;font-weight:700;padding:0;margin-bottom:10px}.hidden{display:none!important}footer{text-align:center;font-size:12px;color:var(--muted);margin-top:32px}@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side button{min-width:165px}}@media(max-width:580px){.grid,.scenario-list,.controls,.stats,.twocol{grid-template-columns:1fr}.panel{padding:17px}.hero{padding:22px}.top{padding:15px}.steps button{flex:1}}

.family[data-family="ext"]{border-top:5px solid #d34b5c}.family[data-family="pub"]{border-top:5px solid #087f77}.family[data-family="info"]{border-top:5px solid #2478d1}.family[data-family="power"]{border-top:5px solid #8758c8}
.learning{border:1px solid #d7e4f0;background:linear-gradient(130deg,#f7fbff,#eff8f6);border-radius:14px;padding:17px;margin:16px 0}.learning h4{margin:0 0 10px;font-size:16px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.comparison>div{border:1px solid #dce5ee;background:white;border-radius:12px;padding:13px}.comparison b{display:block;margin-bottom:7px}.comparison p{margin:6px 0}.tiny{font-size:12px;color:#566b83}.formula{background:#132b48;color:#f3f8ff;border-radius:10px;padding:13px;font-family:ui-monospace,monospace;white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.tabs button{border:1px solid #ccdce9;border-radius:9px;background:white;padding:8px 11px;color:#173b61}.tabs button.active{background:#174c79;color:white}.decision{font-size:15px;font-weight:700;margin:8px 0}.keypoint{font-weight:800;color:#135b63}.chart text{font-family:system-ui,Arial}.family,.scenario,.btn,.choice{transition:background .15s,border-color .15s,transform .15s}details summary{cursor:pointer} .summary-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
@media(max-width:650px){.comparison{grid-template-columns:1fr}.chart{max-height:none}.stat b{font-size:20px}}@media print{.top,.side,.steps,.actions,.summary-actions,.back,.toolbar,.controls,footer{display:none!important}body{background:white;color:#111}main{max-width:100%;padding:0}.panel,.learning{break-inside:avoid;box-shadow:none;border-color:#ddd}.layout{display:block}.chart{max-width:600px}}

const translations={fr:{home:'Accueil',hero:'Laboratoire des défaillances du marché',intro:'Comprendre pourquoi les décisions individuelles ne conduisent pas toujours à l’optimum social. Prédisez, expérimentez, expliquez et relevez les défis.',families:'Les quatre grandes familles',choose:'Choisissez une expérience',start:'Ouvrir',predict:'1 · Prédire',test:'2 · Expérimenter',explain:'3 · Comprendre',challenge:'4 · Défi',remember:'5 · Retenir',check:'Vérifier ma réponse',next:'Étape suivante',back:'Retour',reset:'Réinitialiser',correct:'Bonne réponse !',incorrect:'Pas tout à fait.',experiment:'Expérience',simulation:'Simulation pédagogique · données fictives',model:'Hypothèses du modèle',final:'Défi final · Diagnostiquez la défaillance',score:'Votre score',retry:'Recommencer',see:'Voir les expériences',q:'Question',of:'sur',solution:'Solution possible',key:'À retenir pour le DE',source:'Références et limites',conclude:'Le simulateur simplifie volontairement les mécanismes : les données numériques ne sont pas des statistiques observées.'},en:{home:'Home',hero:'Market Failures Laboratory',intro:'Explore why individual choices do not always produce socially efficient outcomes. Predict, experiment, explain and take on challenges.',families:'Four major families',choose:'Choose an experiment',start:'Open',predict:'1 · Predict',test:'2 · Experiment',explain:'3 · Understand',challenge:'4 · Challenge',remember:'5 · Remember',check:'Check answer',next:'Next step',back:'Back',reset:'Reset',correct:'Correct!',incorrect:'Not quite.',experiment:'Experiment',simulation:'Educational simulation · fictional data',model:'Model assumptions',final:'Final challenge · Diagnose the failure',score:'Your score',retry:'Try again',see:'See experiments',q:'Question',of:'of',solution:'Possible solution',key:'Remember for the exam',source:'References and limitations',conclude:'The simulator intentionally simplifies the mechanisms: numerical data are not observed statistics.'}};
const families=[{id:'ext',icon:'🏭',fr:'Externalités',en:'Externalities',frsub:'Coûts cachés, bénéfices diffus et régulation',ensub:'Hidden costs, spillovers and regulation'},{id:'pub',icon:'🐟',fr:'Biens publics et ressources communes',en:'Public goods and common resources',frsub:'Passager clandestin et surexploitation',ensub:'Free riding and overuse'},{id:'info',icon:'🔍',fr:'Asymétries d’information',en:'Information asymmetry',frsub:'Sélection adverse et aléa moral',ensub:'Adverse selection and moral hazard'},{id:'power',icon:'📈',fr:'Pouvoir de marché',en:'Market power',frsub:'Monopole, barrières à l’entrée, effets de réseau',ensub:'Monopoly, entry barriers, network effects'}];
const scenarios=[
{id:'pollution',family:'ext',icon:'🏭',fr:'Le marché polluant',en:'The polluting market',frsub:'Pourquoi le marché produit-il trop ?',ensub:'Why does the market overproduce?',kind:'negative',defaults:[30,0],frquestion:'Une usine ne paie pas les dommages causés par sa pollution. Par rapport à l’optimum social, le marché produira…',enquestion:'A factory does not pay for its pollution. Relative to the social optimum, the market will produce…',choices:{fr:['Trop','Pas assez','La quantité optimale'],en:['Too much','Too little','The optimal amount']},answer:0,frwhy:'Le producteur compare le bénéfice marginal au coût marginal privé, inférieur au coût marginal social : certaines unités produites coûtent plus à la collectivité qu’elles ne rapportent.',enwhy:'The producer compares marginal benefit to private marginal cost, which is below social marginal cost: some units cost society more than they are worth.',frkey:'Externalité négative → CMS > CMP → Qmarché > Qoptimum → perte sèche. Une taxe égale au dommage marginal peut internaliser le coût (sous hypothèses).',enkey:'Negative externality → SMC > PMC → Qmarket > Qoptimal → deadweight loss. A tax equal to marginal damage can internalize the cost (under assumptions).'},
{id:'innovation',family:'ext',icon:'🔬',fr:'L’innovation et la R&D',en:'Innovation and R&D',frsub:'Pourquoi le marché n’investit-il pas assez ?',ensub:'Why is there underinvestment?',kind:'positive',defaults:[30,0],frquestion:'Les innovations d’une entreprise bénéficient gratuitement à d’autres. Le marché investit-il assez en R&D ?',enquestion:'A firm’s innovations benefit others for free. Does the market invest enough in R&D?',choices:{fr:['Oui, toujours','Non, risque de sous-investissement','Non, risque de surinvestissement'],en:['Yes, always','No, risk of underinvestment','No, risk of overinvestment']},answer:1,frwhy:'Les bénéfices reçus par des tiers ne sont pas intégrés au rendement privé. Le bénéfice marginal social dépasse le bénéfice marginal privé.',enwhy:'Benefits to third parties are not fully captured by the innovator. Social marginal benefit exceeds private marginal benefit.',frkey:'Externalité positive → BMS > BMP → Qmarché < Qoptimum. Subventions, brevets ou soutien à la recherche peuvent modifier les incitations.',enkey:'Positive externality → SMB > PMB → Qmarket < Qoptimal. Subsidies, patents or research support can change incentives.'},
{id:'regulator',family:'ext',icon:'⚖️',fr:'Vous êtes le régulateur',en:'You are the regulator',frsub:'Taxe, subvention et quota : quel instrument ?',ensub:'Taxes, subsidies and quotas: which tool?',kind:'regulator',defaults:[30,0],frquestion:'Dans un marché polluant, le dommage marginal est constant à 30 € par unité. Quelle taxe unitaire aligne la quantité privée sur l’optimum social ?',enquestion:'In a polluting market, marginal damage is a constant €30 per unit. Which per-unit tax aligns private output with the social optimum?',choices:{fr:['0 €','15 €','30 €','60 €'],en:['€0','€15','€30','€60']},answer:2,frwhy:'Une taxe pigouvienne égale au dommage marginal externe aligne ici le coût privé après taxe sur le coût social. Le résultat suppose concurrence, information parfaite et dommage constant.',enwhy:'A Pigouvian tax equal to marginal external damage aligns private post-tax cost with social cost here, assuming competition, full information and constant damage.',frkey:'Taxe → renchérit l’activité polluante ; subvention → encourage l’activité à externalité positive ; quota → limite la quantité ; chaque outil comporte des contraintes pratiques.',enkey:'Tax → raises the cost of polluting; subsidy → encourages positive spillovers; quota → limits output; each instrument has practical limitations.'},
{id:'coase',family:'ext',icon:'🤝',fr:'Le fablab et ses voisins',en:'The makerspace and its neighbors',frsub:'Négociation, droits et coûts de transaction',ensub:'Bargaining, rights and transaction costs',kind:'coase',defaults:[900,600],frquestion:'Le fablab gagne 900 €/mois en ouvrant la nuit ; les voisins subissent 600 € de nuisances. Si les voisins peuvent interdire l’activité, quel accord est possible ?',enquestion:'A makerspace gains €900/month from night operation; neighbors suffer €600 of nuisance. If neighbors can prohibit it, what deal is possible?',choices:{fr:['Aucune compensation possible','Une compensation entre 600 et 900 €','Une compensation supérieure à 900 €'],en:['No compensation is possible','Compensation between €600 and €900','Compensation above €900']},answer:1,frwhy:'Une compensation de 600 à 900 € peut satisfaire les deux parties si les droits sont clairs et les coûts de transaction suffisamment faibles. Le surplus total potentiel est de 300 €.',enwhy:'Compensation of €600–€900 can benefit both parties if rights are clear and transaction costs low enough. Potential joint surplus is €300.',frkey:'Coase : avec droits définis et coûts de transaction nuls, la négociation peut conduire à une allocation efficace ; la répartition des gains dépend des droits initiaux.',enkey:'Coase: with defined rights and zero transaction costs, bargaining can reach an efficient allocation; who gets the gains depends on initial rights.'},
{id:'public',family:'pub',icon:'🌊',fr:'La digue contre les inondations',en:'The flood barrier',frsub:'Le problème du passager clandestin',ensub:'The free-rider problem',kind:'public',defaults:[12,4],frquestion:'Une digue protège tous les habitants, même ceux qui ne contribuent pas. Quel risque apparaît avec un financement uniquement volontaire ?',enquestion:'A flood barrier protects all residents, even those who do not contribute. What happens with purely voluntary funding?',choices:{fr:['Sous-financement','Surproduction certaine','Aucun problème'],en:['Underfunding','Guaranteed overproduction','No problem']},answer:0,frwhy:'Si les non-payeurs ne peuvent pas être exclus, chacun peut préférer laisser les autres financer la digue. Le financement volontaire peut être inférieur au niveau socialement souhaitable.',enwhy:'When non-payers cannot be excluded, everyone may prefer that others pay. Voluntary contributions can fall short of the socially desirable level.',frkey:'Bien public pur : non rival et non excluable. Passager clandestin → financement insuffisant possible. Solutions : financement collectif, impôt, coordination.',enkey:'Pure public good: non-rival and non-excludable. Free riding → possible underfunding. Responses: collective funding, taxes, coordination.'},
{id:'commons',family:'pub',icon:'🐟',fr:'La pêche en accès libre',en:'Open-access fishing',frsub:'Tragédie des ressources communes',ensub:'The tragedy of the commons',kind:'commons',defaults:[8,0],frquestion:'Plusieurs pêcheurs exploitent librement le même stock. Sans règles collectives, quelle tendance risque d’apparaître ?',enquestion:'Fishers freely exploit the same stock. Without collective rules, what is likely to happen?',choices:{fr:['Un stock toujours stable','Une surexploitation du stock','Aucune rivalité'],en:['A stock that always stays stable','Overexploitation of the stock','No rivalry']},answer:1,frwhy:'Chaque pêcheur capte le bénéfice de sa prise mais ne supporte qu’une partie du coût collectif lié à la diminution du stock.',enwhy:'Each fisher captures the benefit of their catch but bears only part of the collective cost of depleting the stock.',frkey:'Ressource commune : rivale et difficile à exclure. Accès libre → effort excessif possible. Quotas, droits d’usage, surveillance et gestion collective.',enkey:'Common resource: rival and difficult to exclude. Open access → possible excessive effort. Quotas, access rights, monitoring and collective governance.'},
{id:'lemons',family:'info',icon:'📱',fr:'Le marché des smartphones reconditionnés',en:'Refurbished smartphones',frsub:'La sélection adverse avant la vente',ensub:'Adverse selection before purchase',kind:'lemons',defaults:[50,0],frquestion:'Les acheteurs ne peuvent pas distinguer les smartphones fiables des appareils défectueux. Quel phénomène risque d’apparaître ?',enquestion:'Buyers cannot distinguish reliable refurbished phones from defective ones. What may happen?',choices:{fr:['Les bons vendeurs quittent le marché','Tous les appareils deviennent meilleurs','Les prix révèlent toujours la qualité'],en:['Good sellers exit the market','All devices improve','Prices always reveal quality']},answer:0,frwhy:'Les acheteurs proposent un prix reflétant la qualité moyenne attendue. Si ce prix est trop faible pour les vendeurs de qualité, ceux-ci se retirent : sélection adverse.',enwhy:'Buyers offer a price based on expected average quality. If this is too low for high-quality sellers, they leave: adverse selection.',frkey:'Sélection adverse : information cachée AVANT le contrat. Garanties, certification et vérification de la qualité peuvent réduire le problème.',enkey:'Adverse selection: hidden information BEFORE contracting. Warranties, certification and quality checks can help.'},
{id:'moral',family:'info',icon:'🛡️',fr:'Le prestataire de cybersécurité',en:'The cybersecurity contractor',frsub:'L’aléa moral après le contrat',ensub:'Moral hazard after contracting',kind:'moral',defaults:[25,0],frquestion:'Après signature, le client ne peut pas vérifier l’effort de surveillance du prestataire. Quel risque apparaît ?',enquestion:'After signing, the client cannot observe the contractor’s monitoring effort. What risk arises?',choices:{fr:['Sélection adverse uniquement','Aléa moral','Bien public pur'],en:['Only adverse selection','Moral hazard','Pure public good']},answer:1,frwhy:'L’effort est une action difficilement observable après le contrat. Le prestataire peut réduire son effort s’il n’en supporte pas toutes les conséquences.',enwhy:'Effort is hard to observe after contracting. The provider may reduce effort when it does not bear all the consequences.',frkey:'Aléa moral : action cachée APRÈS le contrat. Audit, indicateurs vérifiables et clauses incitatives réduisent le risque.',enkey:'Moral hazard: hidden action AFTER contracting. Audits, verifiable indicators and incentive contracts help.'},
{id:'monopoly',family:'power',icon:'🏢',fr:'La plateforme en monopole',en:'The monopoly platform',frsub:'Prix, quantité et perte sèche',ensub:'Price, output and deadweight loss',kind:'monopoly',defaults:[20,0],frquestion:'Par rapport à une concurrence parfaite (à coûts identiques), un monopole non régulé tend à fixer…',enquestion:'Compared with perfect competition (same costs), an unregulated monopoly tends to set…',choices:{fr:['Un prix plus haut et une quantité plus faible','Un prix plus faible et une quantité plus grande','Le même prix et la même quantité'],en:['A higher price and lower quantity','A lower price and higher quantity','The same price and quantity']},answer:0,frwhy:'Le monopole maximise son profit en égalisant recette marginale et coût marginal, ce qui conduit généralement à une quantité plus faible et un prix plus élevé.',enwhy:'A monopolist maximizes profit where marginal revenue equals marginal cost, typically choosing lower output and a higher price.',frkey:'Pouvoir de marché → P > CM possible → restriction des quantités et perte sèche. Attention : monopole ne signifie pas automatiquement abus illégal.',enkey:'Market power → P > MC possible → restricted output and deadweight loss. Monopoly does not automatically mean unlawful abuse.'},
{id:'network',family:'power',icon:'🌐',fr:'Les effets de réseau',en:'Network effects',frsub:'Pourquoi une plateforme devient dominante',ensub:'Why platforms become dominant',kind:'network',defaults:[50,0],frquestion:'Une plateforme devient plus utile à mesure que ses utilisateurs sont nombreux. Quel obstacle peut rencontrer un nouvel entrant ?',enquestion:'A platform becomes more useful as its user base grows. What barrier may a newcomer face?',choices:{fr:['Aucune difficulté liée à la taille','Une difficulté à attirer les premiers utilisateurs','Une demande toujours indépendante du réseau'],en:['No size-related difficulty','Difficulty attracting early users','Demand always independent of network size']},answer:1,frwhy:'Les utilisateurs valorisent un grand réseau. Une petite plateforme peut peiner à attirer des usagers malgré une bonne technologie : effet de réseau et verrouillage possible.',enwhy:'Users value large networks. A small entrant can struggle to attract users despite good technology: network effects and potential lock-in.',frkey:'Effets de réseau → avantage aux réseaux déjà grands, barrières à l’entrée et risque de verrouillage. L’interopérabilité et la portabilité peuvent aider.',enkey:'Network effects → advantage for incumbents, entry barriers and potential lock-in. Interoperability and portability can help.'}
];
let lang='fr',active=null,stage=0,selected=null,checked=false,vals=[],quizAt=0,quizAnswers=[],quizChecked=false;
const t=k=>translations[lang][k],tr=(obj,key)=>obj[lang+key]||'',fmt=n=>Number(n).toLocaleString(lang==='fr'?'fr-FR':'en-US',{maximumFractionDigits:1});
function toggleLang(){lang=lang==='fr'?'en':'fr';document.documentElement.lang=lang;document.getElementById('langBtn').textContent=lang==='fr'?'EN':'FR';document.querySelector('[data-i=home]').textContent=t('home');render()}
function home(){active=null;render();window.scrollTo(0,0)}
function openScenario(id){active=id;stage=0;selected=null;checked=false;vals=[...scenarios.find(s=>s.id===id).defaults];render();window.scrollTo(0,0)}
function setStage(n){stage=n;selected=null;checked=false;render()}
function pick(i){selected=i;render()}
function check(){checked=true;render()}
function adjust(i,v){vals[i]=Number(v);render()}
function reset(){vals=[...scenarios.find(s=>s.id===active).defaults];render()}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.getElementById('app').innerHTML=active==='final'?finalView():active?scenarioView():homeView()}
const glossaryEntries={fr:[['CMP','Coût marginal privé','Coût supplémentaire supporté par le producteur pour une unité produite de plus.'],['CMS','Coût marginal social','Coût marginal privé augmenté des dommages marginaux subis par des tiers.'],['CME','Coût marginal externe','Dommage supplémentaire imposé à des tiers par une unité produite de plus.'],['BMP','Bénéfice marginal privé','Avantage supplémentaire obtenu directement par le consommateur ou le décideur.'],['BMS','Bénéfice marginal social','Bénéfice marginal privé augmenté des bénéfices marginaux reçus par des tiers.'],['BME','Bénéfice marginal externe','Avantage supplémentaire reçu par des tiers sans compensation directe.'],['Q marché','Quantité d’équilibre du marché','Quantité déterminée par les décisions privées.'],['Q optimale','Quantité socialement optimale','Quantité maximisant le surplus total en tenant compte des effets sur les tiers.'],['R&D','Recherche et développement','Activités de création et d’amélioration de connaissances, produits et procédés.'],['SEQE-UE','Système d’échange de quotas d’émission de l’Union européenne','Marché réglementé de quotas d’émission de gaz à effet de serre.']],en:[['PMC / CMP','Private marginal cost','Additional production cost borne privately for one more unit.'],['SMC / CMS','Social marginal cost','Private marginal cost plus marginal damage to third parties.'],['MEC / CME','Marginal external cost','Additional harm imposed on third parties by one more unit.'],['PMB / BMP','Private marginal benefit','Additional benefit received directly by the decision-maker.'],['SMB / BMS','Social marginal benefit','Private marginal benefit plus marginal benefits received by others.'],['MEB / BME','Marginal external benefit','Additional benefit received by third parties without direct compensation.'],['Market Q','Market equilibrium quantity','Quantity arising from private market decisions.'],['Optimal Q','Socially optimal quantity','Quantity maximizing total surplus including spillovers.'],['R&D','Research and development','Work to develop knowledge, products and processes.'],['EU ETS / SEQE-UE','European Union Emissions Trading System','Regulated cap-and-trade system for greenhouse-gas emissions.']]};
function glossary(){return `<details class="glossary"><summary>${lang==='fr'?'📖 Glossaire — sigles, courbes et termes économiques (ouvrir)':'📖 Glossary — abbreviations, curves and economic terms (open)'}</summary><dl>${glossaryEntries[lang].map(([short,long,definition])=>`<div><dt>${esc(short)} — ${esc(long)}</dt><dd>${esc(definition)}</dd></div>`).join('')}</dl></details>`}
function expandAcronyms(label){let terms=lang==='fr'?{'BMS':'Bénéfice marginal social','BMP':'Bénéfice marginal privé','CMS':'Coût marginal social','CMP':'Coût marginal privé','PMC':'Coût marginal privé','PMB':'Bénéfice marginal privé','SMC':'Coût marginal social','SMB':'Bénéfice marginal social'}:{'BMS':'Social marginal benefit','BMP':'Private marginal benefit','CMS':'Social marginal cost','CMP':'Private marginal cost','PMC':'Private marginal cost','PMB':'Private marginal benefit','SMC':'Social marginal cost','SMB':'Social marginal benefit'};return label.replace(/\b(BMS|BMP|CMS|CMP|PMC|PMB|SMC|SMB)\b/g,a=>terms[a]||a)}
function baseHomeView(){return `<section class="hero"><div class="eyebrow">EFREI · APFG55 · SÉANCE 3</div><h1>${t('hero')}</h1><p>${t('intro')}</p></section><h2 class="sectiontitle">${t('families')}</h2><div class="grid">${families.map(f=>`<button class="family" onclick="document.getElementById('family-${f.id}').scrollIntoView({behavior:'smooth'})"><div class="emoji">${f.icon}</div><strong>${esc(f[lang])}</strong><span>${esc(f[lang+'sub'])}</span></button>`).join('')}</div>${families.map(f=>`<section id="family-${f.id}"><h2 class="sectiontitle">${f.icon} ${esc(f[lang])}</h2><div class="scenario-list">${scenarios.filter(s=>s.family===f.id).map(s=>`<button class="scenario" onclick="openScenario('${s.id}')"><span class="pill">${t('experiment')} ${scenarios.indexOf(s)+1}</span><strong style="margin:8px 0 3px">${s.icon} ${esc(s[lang])}</strong><span>${esc(s[lang+'sub'])} →</span></button>`).join('')}</div></section>`).join('')}<section class="panel" style="margin-top:25px"><h2>${t('final')}</h2><p class="muted">${lang==='fr'?'Six situations mêlant les quatre défaillances. Identifiez la cause et le mécanisme.':'Six situations across all four market failures. Identify the mechanism.'}</p><button class="btn" onclick="startFinal()">${t('start')} →</button></section>${glossary()}<footer>${t('conclude')}</footer>`}
function scenarioView(){let s=scenarios.find(x=>x.id===active);return `<button class="back" onclick="home()">← ${t('home')}</button><div class="layout"><nav class="side">${scenarios.map((x,i)=>`<button class="${x.id===active?'active':''}" onclick="openScenario('${x.id}')">${i+1}. ${esc(x[lang])}</button>`).join('')}<button onclick="startFinal()">🎓 ${t('final')}</button></nav><div class="workspace"><section class="panel"><span class="pill">${families.find(f=>f.id===s.family)[lang]}</span><h2>${s.icon} ${esc(s[lang])}</h2><p class="muted">${esc(s[lang+'sub'])}</p><div class="steps">${['predict','test','explain','challenge','remember'].map((k,i)=>`<button class="${stage===i?'active':''}" onclick="setStage(${i})">${t(k)}</button>`).join('')}</div><div class="progress"><div style="width:${(stage+1)*20}%"></div></div></section><section class="panel">${stage===0?predictView(s):stage===1?experimentView(s):stage===2?explainView(s):stage===3?challengeView(s):rememberView(s)}<div class="actions">${stage>0?`<button class="btn secondary" onclick="setStage(${stage-1})">← ${t('back')}</button>`:''}${stage<4?`<button class="btn" onclick="setStage(${stage+1})">${t('next')} →</button>`:`<button class="btn" onclick="home()">${t('see')} →</button>`}</div></section>${glossary()}</div></div>`}
function predictView(s){return `<h3>${t('predict')}</h3><p class="question">${esc(tr(s,'question'))}</p><div class="choices">${s.choices[lang].map((c,i)=>`<button class="choice ${selected===i?'selected':''} ${checked&&i===s.answer?'correct':''} ${checked&&selected===i&&i!==s.answer?'wrong':''}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}</div><div class="actions"><button class="btn" onclick="check()" ${selected===null?'disabled':''}>${t('check')}</button></div>${checked?`<div class="feedback ${selected===s.answer?'':'warning'}"><b>${selected===s.answer?t('correct'):t('incorrect')}</b> ${esc(tr(s,'why'))}</div>`:''}`}
function range(label,value,i,min,max,step=1,unit=''){return `<div class="control"><label><span>${label}</span><b>${fmt(value)} ${unit}</b></label><input aria-label="${esc(label)}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" onchange="adjust(${i},this.value)"></div>`}
function stats(items){return `<div class="stats">${items.map(([l,v])=>`<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('')}</div>`}
function svgChart(lines,points=[],extra=''){let x=q=>52+q*22,y=v=>250-v*1.45;let out=`<svg class="chart" viewBox="0 0 355 285" role="img" aria-label="Economic chart"><line x1="52" y1="250" x2="337" y2="250" stroke="#52677e" stroke-width="1.4"/><line x1="52" y1="250" x2="52" y2="15" stroke="#52677e" stroke-width="1.4"/><text x="56" y="13" fill="#566b83" font-size="11">${lang==='fr'?'Prix / coût / bénéfice':'Price / cost / benefit'}</text><text x="333" y="271" text-anchor="end" fill="#566b83" font-size="11">${lang==='fr'?'Quantité':'Quantity'}</text>`;[0,4,8,12].forEach(q=>out+=`<text x="${x(q)}" y="267" font-size="10" text-anchor="middle" fill="#566b83">${q}</text>`);[40,80,120].forEach(v=>out+=`<line x1="52" y1="${y(v)}" x2="337" y2="${y(v)}" stroke="#dce5ee"/><text x="43" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#566b83">${v}</text>`);out+=extra;lines.forEach(l=>{let arr=Array.from({length:13},(_,i)=>[x(i),y(l.fn(i))]);out+=`<polyline points="${arr.map(a=>a.join(',')).join(' ')}" fill="none" stroke="${l.color}" stroke-width="2.8" ${l.dash?'stroke-dasharray="6 5"':''}/>`});points.forEach(p=>{out+=`<line x1="${x(p.q)}" y1="${y(p.v)}" x2="${x(p.q)}" y2="250" stroke="${p.color}" stroke-dasharray="4 4"/><circle cx="${x(p.q)}" cy="${y(p.v)}" r="5" fill="${p.color}" stroke="white" stroke-width="1.5"/>`});return out+'</svg>'+`<div class="legend">${lines.map(l=>`<span><i class="dot" style="background:${l.color}"></i>${esc(expandAcronyms(l.label))}</span>`).join('')}</div>`}
function baseMarketGraph(kind){let d=vals[0],tax=vals[1],neg=kind!=='positive';let demand=q=>140-8*q,pmc=q=>20+6*q;if(neg){let qm=(120-tax)/14,qs=(120-d)/14,loss=7*(qm-qs)**2;let chart=svgChart([{label:lang==='fr'?'Demande (bénéfice marginal social)':'Demand (social marginal benefit)',color:'#2478d1',fn:demand},{label:lang==='fr'?'Coût marginal privé':'Private marginal cost',color:'#dc8c22',fn:pmc},{label:lang==='fr'?'Coût marginal social':'Social marginal cost',color:'#d34b5c',fn:q=>pmc(q)+d},...(tax?[{label:lang==='fr'?'Coût marginal privé + taxe':'Private marginal cost + tax',color:'#087f77',fn:q=>pmc(q)+tax,dash:true}]:[])],[{q:qm,v:demand(qm),color:'#087f77'},{q:qs,v:demand(qs),color:'#d34b5c'}]);return {chart,metrics:[[lang==='fr'?'Q marché':'Market Q',fmt(qm)],[lang==='fr'?'Q optimale':'Optimal Q',fmt(qs)],[lang==='fr'?'Perte sèche':'Deadweight loss',fmt(loss)+' €']],text:lang==='fr'?'Une taxe égale au dommage marginal rapproche la quantité privée de l’optimum social. Une taxe excessive peut créer une sous-production.':'A tax equal to marginal damage aligns private and social output; an excessive tax can create underproduction.'}}else{let pmb=q=>140-8*q,sm=q=>pmb(q)+d,mc=q=>20+6*q,qm=120/14,qs=(120+d)/14,loss=7*(qs-qm)**2;return {chart:svgChart([{label:lang==='fr'?'Bénéfice marginal privé':'Private marginal benefit',color:'#2478d1',fn:pmb},{label:lang==='fr'?'Bénéfice marginal social':'Social marginal benefit',color:'#087f77',fn:sm},{label:lang==='fr'?'Coût marginal privé':'Private marginal cost',color:'#dc8c22',fn:mc}],[{q:qm,v:mc(qm),color:'#2478d1'},{q:qs,v:mc(qs),color:'#087f77'}]),metrics:[[lang==='fr'?'Q marché':'Market Q',fmt(qm)],[lang==='fr'?'Q optimale':'Optimal Q',fmt(qs)],[lang==='fr'?'Perte sèche':'Deadweight loss',fmt(loss)+' €']],text:lang==='fr'?'Le bénéfice reçu par les tiers déplace le bénéfice social vers le haut. Le marché investit moins que l’optimum social.':'Spillover benefits shift social marginal benefit upward. Private investment is below the social optimum.'}}}
function baseExperimentView(s){let k=s.kind,out=`<h3>${t('test')}</h3>`;if(['negative','positive','regulator'].includes(k)){let d=vals[0],tax=vals[1],g=marketGraph(k==='positive'?'positive':'negative');out+=`<p class="muted">${lang==='fr'?'Déplacez les curseurs et observez comment changent les courbes et les quantités.':'Move the sliders and watch the curves and quantities change.'}</p><div class="controls">${range(lang==='fr'?(k==='positive'?'Bénéfice externe marginal':'Dommage externe marginal'):'Marginal external '+(k==='positive'?'benefit':'damage'),d,0,0,60,5,'€')}${k==='regulator'||k==='negative'?range(lang==='fr'?'Taxe unitaire':'Per-unit tax',tax,1,0,60,5,'€'):''}</div>${g.chart}${stats(g.metrics)}<div class="feedback">${g.text}</div>`;if(k==='regulator')out+=`<div class="mini"><b>${lang==='fr'?'Comparer les instruments':'Compare instruments'}</b>${lang==='fr'?'Taxe : agit sur le coût marginal. Quota : fixe directement une quantité maximale. Subvention : pertinente pour une externalité positive, mais son financement a un coût.':'Tax: changes marginal cost. Quota: caps output directly. Subsidy: relevant for positive externalities, but funding is costly.'}<div class="actions"><button class="btn secondary" onclick="adjust(1,vals[0])">${lang==='fr'?'Taxe = dommage':'Tax = damage'}</button><button class="btn secondary" onclick="adjust(1,0)">${lang==='fr'?'Sans taxe':'No tax'}</button></div></div>`;}
else if(k==='coase'){let [gain,harm]=vals,net=gain-harm;out+=`<div class="controls">${range(lang==='fr'?'Gain mensuel du fablab':'Monthly makerspace gain',gain,0,300,1500,50,'€')}${range(lang==='fr'?'Nuisances mensuelles':'Monthly nuisance cost',harm,1,0,1200,50,'€')}</div>${stats([[lang==='fr'?'Gain privé':'Private gain',fmt(gain)+' €'],[lang==='fr'?'Coût pour les voisins':'Neighbor cost',fmt(harm)+' €'],[lang==='fr'?'Surplus net':'Net surplus',fmt(net)+' €']])}<div class="feedback ${net<=0?'warning':''}">${net>0?(lang==='fr'?`Si les voisins ont le droit d’interdire l’activité, une compensation comprise entre ${fmt(harm)} € et ${fmt(gain)} € peut permettre un accord mutuellement avantageux.`:`If neighbors hold the right to prevent operation, compensation between €${fmt(harm)} and €${fmt(gain)} can allow a mutually beneficial deal.`):(lang==='fr'?'Le coût des nuisances est au moins égal au gain de l’activité : l’ouverture nocturne ne crée pas de surplus net dans ce modèle.':'Nuisance cost is at least as large as the gain: night operation does not create net surplus in this model.')}</div><p class="note">${lang==='fr'?'Hypothèses : droits clairs, information connue, coûts de transaction nuls. Les coûts juridiques et de négociation peuvent empêcher l’accord.':'Assumptions: clear rights, known payoffs, zero transaction costs. Legal and bargaining costs may prevent a deal.'}</p>`}
else if(k==='public'){let [households,contrib]=vals,cost=60,privateValue=12,total=households*privateValue,raised=households*contrib;out+=`<p class="muted">${lang==='fr'?'Chaque foyer bénéficie de la digue même s’il ne paie pas. Le coût collectif est de 60 unités monétaires.':'Every household benefits even without paying. The barrier costs 60 monetary units.'}</p><div class="controls">${range(lang==='fr'?'Nombre de foyers':'Households',households,0,4,20,1)}${range(lang==='fr'?'Contribution volontaire par foyer':'Voluntary contribution per household',contrib,1,0,12,1,'€')}</div>${stats([[lang==='fr'?'Bénéfice collectif':'Collective benefit',fmt(total)+' €'],[lang==='fr'?'Contributions':'Contributions',fmt(raised)+' €'],[lang==='fr'?'Coût de la digue':'Barrier cost','60 €']])}<div class="feedback ${raised<cost?'warning':''}">${lang==='fr'?(total>cost?'Le projet est socialement avantageux dans ce modèle. ':'Le projet n’est pas socialement avantageux dans ce modèle. ')+(raised>=cost?'Le financement volontaire suffit.':'Pourtant les contributions volontaires ne suffisent pas : c’est le problème du passager clandestin.'):(total>cost?'The project is socially worthwhile. ':'The project is not socially worthwhile. ')+(raised>=cost?'Voluntary funding is sufficient.':'Yet voluntary contributions fall short: free riding.')}</div>`}
else if(k==='commons'){let effort=vals[0],catchPer=10,regen=50,total=effort*catchPer,delta=regen-total;out+=`<p class="muted">${lang==='fr'?'Stock initial : 200 poissons ; reproduction : 50 poissons par période ; capture : 10 poissons par pêcheur.':'Initial stock: 200 fish; reproduction: 50 fish per period; catch: 10 fish per fisher.'}</p>${range(lang==='fr'?'Nombre de pêcheurs actifs':'Active fishers',effort,0,0,12,1)}${stats([[lang==='fr'?'Captures par période':'Catch per period',fmt(total)],[lang==='fr'?'Reproduction':'Reproduction','50'],[lang==='fr'?'Stock après 1 période':'Stock after 1 period',fmt(Math.max(0,200+delta))]])}<div class="mini"><b>${lang==='fr'?'Projection sur 6 périodes':'Six-period projection'}</b><div style="display:flex;gap:5px;align-items:end;height:135px">${Array.from({length:7},(_,i)=>Math.max(0,200+i*delta)).map((v,i)=>`<div style="flex:1;background:${v<100?'#d34b5c':'#2478d1'};height:${Math.max(3,v/320*120)}px;border-radius:5px 5px 0 0" title="t${i}: ${v}"></div>`).join('')}</div><small>${lang==='fr'?'Modèle linéaire simplifié, sans rétroaction biologique.':'Simplified linear model, no biological feedback.'}</small></div><div class="feedback ${delta<0?'warning':''}">${delta<0?(lang==='fr'?'Les captures dépassent la reproduction : le stock diminue. Une règle d’accès ou un quota peut préserver la ressource.':'Catch exceeds reproduction: the stock falls. Access rules or quotas can protect it.'):(lang==='fr'?'Les captures ne dépassent pas la reproduction dans ce modèle.':'Catch does not exceed reproduction in this model.')}</div>`}
else if(k==='lemons'){let good=vals[0]/100,bad=1-good,qualityGood=900,qualityBad=300,price=good*qualityGood+bad*qualityBad,reservation=650,exit=price<reservation;out+=`<p class="muted">${lang==='fr'?'Deux qualités : bonne (valeur 900 €) et mauvaise (300 €). Les acheteurs offrent un prix moyen faute de pouvoir distinguer les appareils.':'Two qualities: good (value €900) and poor (€300). Buyers offer an average price because they cannot identify quality.'}</p>${range(lang==='fr'?'Part des bons appareils':'Share of good devices',vals[0],0,0,100,5,'%')}${stats([[lang==='fr'?'Prix moyen anticipé':'Expected average price',fmt(price)+' €'],[lang==='fr'?'Prix minimum des bons vendeurs':'Good sellers’ minimum','650 €'],[lang==='fr'?'Bons vendeurs restent ?':'Good sellers stay?',exit?(lang==='fr'?'Non':'No'):(lang==='fr'?'Oui':'Yes')]])}<div class="feedback ${exit?'warning':''}">${exit?(lang==='fr'?'Le prix moyen est inférieur au prix de réserve des vendeurs de qualité : ils peuvent quitter le marché, aggravant la sélection adverse.':'Average price is below the high-quality sellers’ reservation price: they may exit, worsening adverse selection.'):(lang==='fr'?'À ce prix, les vendeurs de qualité peuvent rester. Une garantie peut rassurer les acheteurs.':'At this price, good sellers may stay. Warranties can reassure buyers.')}</div><p class="note">${lang==='fr'?'Exemple stylisé inspiré du mécanisme des « lemons » d’Akerlof ; prix de réserve fictifs.':'Stylized illustration of Akerlof’s lemons mechanism; fictional reservation prices.'}</p>`}
else if(k==='moral'){let audit=vals[0],detection=audit/100,penalty=500,saved=120,expectedPenalty=detection*penalty;out+=`<p class="muted">${lang==='fr'?'Le prestataire économise 120 € s’il réduit secrètement son effort. Un audit peut détecter le manquement et entraîner une pénalité de 500 €.':'The provider saves €120 by secretly cutting effort. An audit may detect this and trigger a €500 penalty.'}</p>${range(lang==='fr'?'Probabilité de détection par audit':'Audit detection probability',audit,0,0,100,5,'%')}${stats([[lang==='fr'?'Gain de la triche':'Gain from shirking','120 €'],[lang==='fr'?'Pénalité attendue':'Expected penalty',fmt(expectedPenalty)+' €'],[lang==='fr'?'Incitation à tricher ?':'Incentive to shirk?',expectedPenalty<saved?(lang==='fr'?'Oui':'Yes'):(lang==='fr'?'Non':'No')]])}<div class="feedback">${lang==='fr'?'Si la pénalité attendue est inférieure au gain de l’effort économisé, le contrat peut inciter à relâcher la surveillance. Ici, un taux de détection d’au moins 24 % élimine cette incitation dans le modèle.':'If expected punishment is below the savings from reduced effort, the provider may shirk. A detection probability of at least 24% removes this incentive in the model.'}</div>`}
else if(k==='monopoly'){let cost=vals[0],qcomp=(100-cost)/4,qmon=(100-cost)/8,pcomp=cost,pmon=100-4*qmon,dwl=.5*(qcomp-qmon)*(pmon-cost);out+=`<p class="muted">${lang==='fr'?'Demande inverse : P = 100 − 4Q. Coût marginal constant. Comparez concurrence parfaite et monopole à coûts identiques.':'Inverse demand: P = 100 − 4Q. Constant marginal cost. Compare perfect competition and monopoly at the same cost.'}</p>${range(lang==='fr'?'Coût marginal':'Marginal cost',cost,0,0,80,5,'€')}${svgChart([{label:lang==='fr'?'Demande':'Demand',color:'#2478d1',fn:q=>100-4*q},{label:lang==='fr'?'Recette marginale':'Marginal revenue',color:'#d34b5c',fn:q=>100-8*q},{label:lang==='fr'?'Coût marginal':'Marginal cost',color:'#dc8c22',fn:q=>cost}],[{q:qmon,v:100-4*qmon,color:'#d34b5c'},...(qcomp<=12?[{q:qcomp,v:cost,color:'#087f77'}]:[])])}${stats([[lang==='fr'?'Prix concurrentiel':'Competitive price',fmt(pcomp)+' €'],[lang==='fr'?'Prix de monopole':'Monopoly price',fmt(pmon)+' €'],[lang==='fr'?'Perte sèche':'Deadweight loss',fmt(dwl)+' €']])}<p class="note">${lang==='fr'?'Les points au-delà de Q=12 peuvent être hors graphique ; les valeurs numériques restent exactes.':'Points beyond Q=12 may lie off-chart; numerical values remain correct.'}</p>`}
else if(k==='network'){let incumbent=vals[0],entrant=100-incumbent,base=30,network=.6,vi=base+network*incumbent,ve=base+network*entrant;out+=`<p class="muted">${lang==='fr'?'Deux plateformes identiques techniquement. Leur utilité augmente avec le nombre d’utilisateurs : U = 30 + 0,6 × utilisateurs.':'Two technically identical platforms. Utility rises with users: U = 30 + 0.6 × users.'}</p>${range(lang==='fr'?'Part d’utilisateurs de la plateforme A':'Platform A user share',incumbent,0,0,100,5,'%')}${stats([[lang==='fr'?'Utilité A':'Utility A',fmt(vi)],[lang==='fr'?'Utilité B':'Utility B',fmt(ve)],[lang==='fr'?'Écart d’utilité':'Utility gap',fmt(Math.abs(vi-ve))]])}<div class="mini"><div style="display:flex;height:35px;overflow:hidden;border-radius:9px;color:white;font-weight:800;text-align:center"><div style="width:${incumbent}%;background:#2478d1">${incumbent>=15?'A '+incumbent+'%':''}</div><div style="width:${entrant}%;background:#087f77">${entrant>=15?'B '+entrant+'%':''}</div></div></div><div class="feedback">${lang==='fr'?'À qualité identique, la plateforme la plus grande procure davantage d’utilité. Cela peut rendre l’entrée difficile, sans prouver à lui seul un abus de position dominante.':'With identical quality, the larger network provides more utility. This may hinder entry, but does not by itself establish abuse of dominance.'}</div>`}
return out+`<div class="actions"><button class="btn secondary" onclick="reset()">↺ ${t('reset')}</button></div><p class="note">${t('simulation')}</p>`}
function explainView(s){let extra={negative:['Le coût privé ne tient pas compte de la pollution. La courbe de coût social est donc au-dessus de la courbe d’offre privée.','Private cost omits pollution. Social marginal cost lies above private supply.'],positive:['L’innovateur ne capte qu’une partie de la valeur créée. Le bénéfice social est plus élevé que le bénéfice privé.','The innovator captures only part of the value created. Social benefit exceeds private benefit.'],regulator:['La taxe modifie l’incitation privée ; le quota agit directement sur la quantité. L’efficacité dépend de la mesure des dommages et des coûts administratifs.','Taxes change private incentives; quotas directly limit output. Effectiveness depends on measuring damages and administrative costs.'],coase:['Le droit initial détermine qui doit compenser qui. Avec coûts de transaction nuls, l’accord peut être efficace ; avec coûts élevés, il peut échouer.','Initial rights determine who pays whom. With zero transaction costs, bargaining can be efficient; high costs can block it.'],public:['Non-excluabilité et non-rivalité peuvent favoriser le passager clandestin. Les contributions individuelles ne révèlent pas forcément la valeur collective.','Non-excludability and non-rivalry encourage free riding. Individual contributions may not reveal collective value.'],commons:['La ressource est rivale mais l’exclusion est difficile. Les utilisateurs ne supportent pas tout le coût marginal de leurs prélèvements.','The resource is rival but exclusion is difficult. Users do not bear the full marginal cost of extraction.'],lemons:['La qualité est cachée avant la transaction. Les prix reflètent la qualité moyenne attendue et peuvent évincer les meilleurs produits.','Quality is hidden before purchase. Prices reflect expected average quality and may drive out better products.'],moral:['L’effort est caché après la signature. Un contrat doit aligner les intérêts par contrôle, réputation ou rémunération conditionnelle.','Effort is hidden after contracting. Audits, reputation and performance-based contracts can align incentives.'],monopoly:['Le monopole tient compte de l’effet de la quantité sur le prix. La recette marginale est inférieure au prix ; il réduit la quantité par rapport à la concurrence.','A monopolist accounts for how quantity affects price. Marginal revenue is below price; output is restricted relative to competition.'],network:['Les effets de réseau peuvent créer un avantage auto-renforçant. Ils ne sont pas nécessairement nuisibles : ils apportent aussi une valeur réelle aux utilisateurs.','Network effects can create self-reinforcing advantages. They are not necessarily harmful: they also create genuine user value.']};return `<h3>${t('explain')}</h3><div class="mini"><b>${lang==='fr'?'Le mécanisme économique':'Economic mechanism'}</b>${extra[s.kind][lang==='fr'?0:1]}</div><div class="twocol" style="margin-top:12px"><div class="mini"><b>${lang==='fr'?'Cause':'Cause'}</b>${lang==='fr'?'Les incitations privées, les droits, l’information ou la concurrence ne correspondent pas aux conditions d’un marché efficace.':'Private incentives, rights, information or competition diverge from efficient-market conditions.'}</div><div class="mini"><b>${lang==='fr'?'Conséquence':'Consequence'}</b>${esc(tr(s,'why'))}</div></div><div class="feedback"><b>${lang==='fr'?'Exemple concret':'Real-world illustration'}</b><p>${example(s.kind)}</p></div>`}
function example(k){let examples={negative:['Pollution atmosphérique liée aux transports routiers : les riverains peuvent subir des dommages sans participer à l’achat du carburant.','Road traffic air pollution can harm residents who do not buy the fuel.'],positive:['Diffusion de connaissances entre entreprises après une publication scientifique ou une innovation technologique.','Knowledge spillovers between firms after research publications or technological innovation.'],regulator:['Le SEQE-UE fixe un plafond d’émissions et permet l’échange de quotas ; une taxe carbone relève d’un instrument de prix.','The EU ETS caps emissions and permits trading; a carbon tax is a price instrument.'],coase:['Un atelier bruyant et ses voisins peuvent négocier des horaires et des compensations, sous réserve de droits clairs et de coûts de transaction raisonnables.','A noisy workshop and neighbors may bargain over hours and compensation when rights are clear and transaction costs manageable.'],public:['La protection collective contre les inondations profite aussi aux foyers qui n’ont pas financé les ouvrages.','Flood defenses also benefit households that did not fund them.'],commons:['Des pêcheries sans contrôle des captures peuvent voir leurs stocks diminuer.','Unregulated fisheries may suffer stock depletion.'],lemons:['La qualité de la batterie d’un smartphone d’occasion est difficile à vérifier avant l’achat.','Battery quality in a used phone is hard to verify before purchase.'],moral:['Une entreprise cliente ne voit pas toutes les vérifications réalisées par son prestataire de cybersécurité.','A client cannot observe every security check performed by its cybersecurity provider.'],monopoly:['Les réseaux locaux d’eau ont des coûts fixes importants ; les grands avions commerciaux constituent un marché très concentré.','Local water networks have high fixed costs; large commercial aircraft markets are highly concentrated.'],network:['Messageries et plateformes sociales : la valeur d’un service dépend en partie des personnes déjà présentes.','Messaging and social platforms: value depends partly on who already uses the service.']};return examples[k][lang==='fr'?0:1]}
function challengeView(s){let tasks={negative:['Avec un dommage marginal de 30 €, une taxe de 10 € corrige-t-elle totalement l’externalité ?','Does a €10 tax fully correct €30 of marginal damage?',0],positive:['Une subvention peut-elle rapprocher l’investissement privé de l’optimum social ?','Can a subsidy bring private investment closer to the social optimum?',1],regulator:['Une taxe de 60 € pour un dommage de 30 € risque-t-elle de réduire excessivement la production ?','Can a €60 tax for €30 damage excessively reduce output?',1],coase:['Si les coûts de négociation dépassent 300 €, l’accord peut-il échouer ?','If bargaining costs exceed €300, can the deal fail?',1],public:['Le fait que la digue soit utile à tous garantit-il son financement volontaire ?','Does collective usefulness guarantee voluntary funding?',0],commons:['Limiter l’accès à la ressource peut-il réduire la surexploitation ?','Can restricting access reduce overuse?',1],lemons:['Une garantie vérifiable peut-elle réduire la sélection adverse ?','Can a verifiable warranty reduce adverse selection?',1],moral:['L’aléa moral apparaît-il principalement avant la signature du contrat ?','Does moral hazard mainly arise before contracting?',0],monopoly:['Une quantité de monopole plus faible peut-elle créer une perte sèche ?','Can lower monopoly output create deadweight loss?',1],network:['Les effets de réseau prouvent-ils automatiquement un abus de position dominante ?','Do network effects automatically prove abuse of dominance?',0]};let [fr,en,ans]=tasks[s.kind];return `<h3>${t('challenge')}</h3><p class="question">${lang==='fr'?fr:en}</p><div class="choices">${[lang==='fr'?'Non':'No',lang==='fr'?'Oui':'Yes'].map((v,i)=>`<button class="choice ${selected===i?'selected':''} ${checked&&i===ans?'correct':''}" onclick="pick(${i})">${v}</button>`).join('')}</div><div class="actions"><button class="btn" ${selected===null?'disabled':''} onclick="check()">${t('check')}</button></div>${checked?`<div class="feedback ${selected===ans?'':'warning'}"><b>${selected===ans?t('correct'):t('incorrect')}</b> ${esc(expandAcronyms(tr(s,'key')))}</div>`:''}`}
function rememberView(s){return `<h3>${t('key')}</h3><div class="feedback" style="font-size:18px">${esc(expandAcronyms(tr(s,'key')))}</div><h3 style="margin-top:24px">${t('source')}</h3><p class="muted">${lang==='fr'?'Les situations sont inspirées de phénomènes réels, mais les données et les fonctions sont fictives et volontairement simplifiées. Les solutions ne sont efficaces que sous les hypothèses indiquées.':'Scenarios reflect real mechanisms, but figures and functions are fictional and deliberately simplified. Policy outcomes depend on stated assumptions.'}</p><div class="mini"><b>${lang==='fr'?'Pour aller plus loin':'Further reading'}</b><span class="muted">Mankiw, <i>Principles of Economics</i> (market failures); Akerlof (1970), “The Market for Lemons”; Coase (1960), “The Problem of Social Cost”; Ostrom (1990), <i>Governing the Commons</i>; European Commission, EU ETS.</span></div>`}
const finalCases=[{fr:'Une usine émet des particules qui dégradent la santé des riverains.',en:'A factory emits particles that harm nearby residents.',a:0},{fr:'Les usagers profitent d’une digue sans contribuer à son financement.',en:'Residents benefit from a flood barrier without paying.',a:1},{fr:'Un vendeur connaît un défaut caché que l’acheteur ignore.',en:'A seller knows of a hidden defect the buyer cannot see.',a:2},{fr:'Une entreprise dominante réduit l’offre et augmente son prix.',en:'A dominant firm restricts output and raises price.',a:3},{fr:'Une nappe phréatique est surexploitée par des usagers en accès libre.',en:'An open-access groundwater resource is overexploited.',a:1},{fr:'Un sous-traitant diminue discrètement son effort après signature.',en:'A contractor secretly reduces effort after signing.',a:2}];
function startFinal(){active='final';quizAt=0;quizAnswers=[];quizChecked=false;render();window.scrollTo(0,0)}
function chooseFinal(i){quizAnswers[quizAt]=i;quizChecked=false;render()}
function nextFinal(){if(quizAt<finalCases.length-1){quizAt++;quizChecked=false}else quizAt=finalCases.length;render()}
function baseFinalView(){let labels=families.map(f=>f[lang]);if(quizAt>=finalCases.length){let score=finalCases.reduce((n,c,i)=>n+(quizAnswers[i]===c.a?1:0),0);return `<button class="back" onclick="home()">← ${t('home')}</button><section class="panel"><h2>${t('score')} : ${score} / ${finalCases.length}</h2><p>${lang==='fr'?'Les défaillances peuvent se cumuler dans la réalité. La bonne démarche consiste à identifier le mécanisme dominant et à justifier le diagnostic.':'Failures can overlap in practice. Identify the dominant mechanism and justify your diagnosis.'}</p>${finalCases.map((c,i)=>`<div class="mini" style="margin:9px 0"><b>${i+1}. ${c[lang]}</b>${lang==='fr'?'Réponse':'Answer'} : ${labels[c.a]} ${quizAnswers[i]===c.a?'✓':'✗'}</div>`).join('')}<div class="actions"><button class="btn" onclick="startFinal()">${t('retry')}</button><button class="btn secondary" onclick="home()">${t('home')}</button></div></section>`}let c=finalCases[quizAt];return `<button class="back" onclick="home()">← ${t('home')}</button><section class="panel"><span class="pill">${t('q')} ${quizAt+1} ${t('of')} ${finalCases.length}</span><h2>${t('final')}</h2><div class="progress"><div style="width:${(quizAt+1)/finalCases.length*100}%"></div></div><p class="question">${esc(c[lang])}</p><div class="choices">${labels.map((label,i)=>`<button class="choice ${quizAnswers[quizAt]===i?'selected':''} ${quizChecked&&i===c.a?'correct':''}" onclick="chooseFinal(${i})">${i+1}. ${esc(label)}</button>`).join('')}</div>${quizChecked?`<div class="feedback ${quizAnswers[quizAt]===c.a?'':'warning'}">${quizAnswers[quizAt]===c.a?t('correct'):t('incorrect')} ${t('solution')} : ${labels[c.a]}</div>`:''}<div class="actions">${!quizChecked?`<button class="btn" ${quizAnswers[quizAt]===undefined?'disabled':''} onclick="quizChecked=true;render()">${t('check')}</button>`:`<button class="btn" onclick="nextFinal()">${quizAt===finalCases.length-1?t('score'):t('next')} →</button>`}</div></section>`}

// Final edition: non-destructive extensions to the validated ten-experiment core.
const coreExperimentView=baseExperimentView;
const coreHomeView=baseHomeView;
const coreFinalView=baseFinalView;
let coaseRight='neighbors',coaseOffer=750,coaseCosts=0;
let quizDetailed=false;
const familyQuestions={ext:['Qui supporte réellement les coûts et les bénéfices ?','Who really bears the costs and receives the benefits?'],pub:['Qui peut en profiter, et qui contribue ?','Who can benefit, and who contributes?'],info:['Qui sait quoi, et à quel moment ?','Who knows what, and when?'],power:['Qui peut influencer les prix et la concurrence ?','Who can influence prices and competition?']};
function homeView(){let html=coreHomeView();for(let f of families){let q=familyQuestions[f.id][lang==='fr'?0:1];let label=f[lang];let re=new RegExp('(<button[^>]*class="family"[^>]*>)([\\s\\S]*?)(</button>)','g'); // Add each category by order, once.
}let n=0;html=html.replace(/<button([^>]*class="family"[^>]*)>/g,(m,attrs)=>`<button${attrs} data-family="${families[n++]?.id||''}">`);
html=html.replace(/(<button[^>]*class="family"[^>]*>[\s\S]*?<span>[^<]*<\/span>)/g,(m)=>{let idx=(homeView._n||0);homeView._n=idx+1;let f=families[idx];return f?m+`<p class="tiny" style="margin:9px 0 0;font-weight:700">${familyQuestions[f.id][lang==='fr'?0:1]}</p>`:m});homeView._n=0;return html}
function resetCoase(){coaseRight='neighbors';coaseOffer=750;coaseCosts=0}

openScenario=function(id){if(id==='coase')resetCoase();oldOpenScenario(id)};
function setCoaseRight(v){coaseRight=v;render()}

function setCoaseCosts(v){coaseCosts=Number(v);render()}
function money(v){return fmt(v)+' €'}
function modelEquations(k){let fr=lang==='fr';let d=vals[0],tax=vals[1];if(['negative','regulator'].includes(k)){let q=(120-tax)/14,qs=(120-d)/14;return (fr?'Demande : P = 140 − 8Q\nCoût marginal privé : CMP = 20 + 6Q\nCoût marginal social : CMS = CMP + '+d+'\n\nÉquilibre après taxe : 140 − 8Q = 20 + 6Q + '+tax+'\nQ = (120 − '+tax+') / 14 = '+fmt(q)+'\n\nOptimum social : 140 − 8Q = 20 + 6Q + '+d+'\nQ* = (120 − '+d+') / 14 = '+fmt(qs)+'\nPerte sèche = 7 × (Q − Q*)² = '+fmt(7*(q-qs)**2)+' €': 'Demand: P = 140 − 8Q\nPrivate marginal cost: PMC = 20 + 6Q\nSocial marginal cost: SMC = PMC + '+d+'\n\nOutput after tax: Q = (120 − '+tax+') / 14 = '+fmt(q)+'\nSocial optimum: Q* = (120 − '+d+') / 14 = '+fmt(qs)+'\nDeadweight loss = 7 × (Q − Q*)² = '+fmt(7*(q-qs)**2)+' €')}
if(k==='positive'){let qm=120/14,qs=(120+d)/14;return fr?`Bénéfice marginal privé : BMP = 140 − 8Q\nBénéfice marginal social : BMS = BMP + ${d}\nCoût marginal : CM = 20 + 6Q\n\nQuantité privée : Q = 120 / 14 = ${fmt(qm)}\nQuantité sociale : Q* = (120 + ${d}) / 14 = ${fmt(qs)}\nPerte sèche = 7 × (Q* − Q)² = ${fmt(7*(qs-qm)**2)} €`:`Private marginal benefit: PMB = 140 − 8Q\nSocial marginal benefit: SMB = PMB + ${d}\nMarginal cost: MC = 20 + 6Q\n\nPrivate output: Q = 120 / 14 = ${fmt(qm)}\nSocial output: Q* = (120 + ${d}) / 14 = ${fmt(qs)}\nDeadweight loss = 7 × (Q* − Q)² = ${fmt(7*(qs-qm)**2)} €`}
if(k==='monopoly'){let c=vals[0],qc=(100-c)/4,qm=(100-c)/8;return fr?`Demande : P = 100 − 4Q\nRecette marginale : RM = 100 − 8Q\nCoût marginal : CM = ${c}\n\nConcurrence : P = CM → Qc = ${fmt(qc)}\nMonopole : RM = CM → Qm = ${fmt(qm)}\nPrix de monopole = ${fmt(100-4*qm)} €\nPerte sèche = ½ × (Qc − Qm) × (Pm − CM) = ${fmt(.5*(qc-qm)*(100-4*qm-c))} €`:`Demand: P = 100 − 4Q\nMarginal revenue: MR = 100 − 8Q\nMarginal cost: MC = ${c}\nCompetition: P = MC → Qc = ${fmt(qc)}\nMonopoly: MR = MC → Qm = ${fmt(qm)}\nMonopoly price = ${fmt(100-4*qm)} €\nDeadweight loss = ½ × (Qc − Qm) × (Pm − MC) = ${fmt(.5*(qc-qm)*(100-4*qm-c))} €`}
return ''}
function comparePanel(k){let fr=lang==='fr',d=vals[0],tax=vals[1];if(['negative','regulator'].includes(k)){let q0=120/14,q1=(120-tax)/14,qs=(120-d)/14;let loss0=7*(q0-qs)**2,loss1=7*(q1-qs)**2;return `<div class="learning"><h4>${fr?'Avant / après intervention':'Before / after intervention'}</h4><div class="comparison"><div><b>${fr?'Sans taxe':'No tax'}</b><p>Q = <strong>${fmt(q0)}</strong></p><p>${fr?'Perte sèche':'Deadweight loss'} : <strong>${money(loss0)}</strong></p></div><div><b>${fr?'Avec taxe de':'With tax of'} ${money(tax)}</b><p>Q = <strong>${fmt(q1)}</strong></p><p>${fr?'Perte sèche':'Deadweight loss'} : <strong>${money(loss1)}</strong></p></div></div><p class="decision">${fr?'Optimum social':'Social optimum'} : Q* = ${fmt(qs)} · ${fr?'Taxe correctrice dans ce modèle':'Corrective tax in this model'} = ${money(d)}</p><p class="tiny">${fr?'La recette fiscale est un transfert, et non une perte sèche. Les dommages environnementaux sont intégrés dans le calcul du bien-être social.':'Tax revenue is a transfer, not a deadweight loss. Environmental damage is included in social welfare.'}</p></div>`}
if(k==='positive'){let qm=120/14,qs=(120+d)/14;return `<div class="learning"><h4>${fr?'Investissement privé et optimum social':'Private investment and social optimum'}</h4><div class="comparison"><div><b>${fr?'Décision privée':'Private choice'}</b>Q = ${fmt(qm)}</div><div><b>${fr?'Avec subvention correctrice':'With corrective subsidy'}</b>Q* = ${fmt(qs)}</div></div><p class="tiny">${fr?'Une subvention unitaire égale au bénéfice externe marginal (ici constant) permettrait, sous ces hypothèses, d’aligner les décisions. Son financement peut toutefois engendrer des coûts non représentés.':'A per-unit subsidy equal to the (constant) marginal external benefit can align decisions under these assumptions. Financing costs are not modeled.'}</p></div>`}
if(k==='monopoly'){let c=vals[0],qc=(100-c)/4,qm=(100-c)/8,pm=100-4*qm;return `<div class="learning"><h4>${fr?'Comparaison des structures de marché':'Market-structure comparison'}</h4><div class="comparison"><div><b>${fr?'Concurrence parfaite':'Perfect competition'}</b><p>Q = ${fmt(qc)}</p><p>P = ${money(c)}</p></div><div><b>${fr?'Monopole':'Monopoly'}</b><p>Q = ${fmt(qm)}</p><p>P = ${money(pm)}</p></div></div><p class="keypoint">${fr?'Le monopole réduit la quantité et augmente le prix dans ce modèle.':'The monopoly reduces output and raises price in this model.'}</p></div>`}return ''}
function coaseExtension(){let fr=lang==='fr',[gain,harm]=vals,net=gain-harm;let tc=coaseCosts,offer=coaseOffer;let rightsNeighbors=coaseRight==='neighbors';let status='',left=0,right=0,deal=false;
if(rightsNeighbors){deal=offer>=harm&&gain-offer-tc>=0;left=gain-offer-tc;right=offer-harm;status=deal?(fr?'Accord possible : le fablab paie les voisins.':'Agreement possible: the makerspace pays neighbors.'):(fr?'Pas d’accord mutuellement acceptable avec cette offre.':'No mutually acceptable agreement at this offer.')}else{deal=offer>=gain&&harm-offer-tc>=0;left=offer-gain;right=harm-offer-tc;status=deal?(fr?'Accord possible : les voisins paient pour obtenir le calme.':'Agreement possible: neighbors pay to obtain quiet.'):(fr?'Pas d’accord mutuellement acceptable avec cette offre.':'No mutually acceptable agreement at this offer.')}
// For the fablab-rights case, the parties bargain to stop activity: surplus = harm - gain.
let rangeLow=rightsNeighbors?harm:gain,rangeHigh=rightsNeighbors?gain-tc:harm-tc;
let effective=rightsNeighbors?(deal?gain-harm-tc:0):(deal?0:gain-harm);
return `<div class="learning"><h4>${fr?'Négocier comme Ronald Coase':'Bargain like Ronald Coase'}</h4><p>${fr?'Ronald Coase (1910–2013), prix Nobel d’économie 1991, a montré que les droits initiaux et les coûts de transaction comptent pour résoudre les externalités.':'Ronald Coase (1910–2013), 1991 Nobel laureate in economics, showed why initial rights and transaction costs matter in addressing externalities.'}</p><p class="tiny">${fr?'The Nature of the Firm (1937) : pourquoi les entreprises existent et coordonnent des activités. The Problem of Social Cost (1960) : droits, négociation, externalités et coûts de transaction.':'The Nature of the Firm (1937): why firms exist and coordinate activities. The Problem of Social Cost (1960): rights, bargaining, externalities and transaction costs.'}</p><p class="decision">${fr?'Qui détient le droit initial ?':'Who holds the initial right?'}</p><div class="tabs"><button class="${rightsNeighbors?'active':''}" onclick="setCoaseRight('neighbors')">${fr?'Voisins : droit au calme':'Neighbors: right to quiet'}</button><button class="${!rightsNeighbors?'active':''}" onclick="setCoaseRight('fablab')">${fr?'Fablab : droit de fonctionner':'Makerspace: right to operate'}</button></div><div class="controls">${range(fr?'Compensation proposée':'Proposed compensation',offer,2,0,1600,25,'€') .replace('onchange="adjust(2,this.value)"','onchange="setCoaseOffer(this.value)"')}${range(fr?'Coûts de négociation totaux':'Total transaction costs',tc,3,0,500,25,'€').replace('onchange="adjust(3,this.value)"','onchange="setCoaseCosts(this.value)"')}</div><div class="comparison"><div><b>${fr?'Sans accord':'Without agreement'}</b>${rightsNeighbors?(fr?'Activité nocturne interdite : gain social additionnel = 0.':'Night operation prohibited: additional social surplus = 0.'):(fr?`Activité autorisée : surplus social = ${money(net)}.`:`Operation allowed: social surplus = ${money(net)}.`)}</div><div><b>${fr?'Avec cette offre':'With this offer'}</b><p class="${deal?'keypoint':''}">${status}</p><p>${fr?'Surplus collectif après coûts':'Collective surplus after costs'} : <strong>${money(effective)}</strong></p></div></div><p class="decision">${fr?'Intervalle de compensation acceptable':'Mutually acceptable compensation range'} : ${rangeHigh>=rangeLow?`${money(rangeLow)} – ${money(rangeHigh)}`:(fr?'aucun avec ces coûts':'none at these costs')}</p><p class="tiny">${fr?'Les montants sont des gains et dommages par mois. Les coûts de transaction sont imputés à la partie qui propose de payer, par simplification. Une compensation redistribue les gains mais ne crée pas, à elle seule, de richesse.':'Figures are monthly benefits and harms. For simplicity, the party proposing payment bears transaction costs. Compensation redistributes gains but does not itself create social surplus.'}</p><p class="keypoint">${fr?'Conclusion : sans coûts de transaction, des droits clairement définis et une information complète peuvent permettre d’atteindre l’issue efficace, quelle que soit l’attribution initiale des droits. La répartition des gains dépend toutefois des droits. Avec des coûts de transaction, l’accord peut échouer.':'Conclusion: with zero transaction costs, clearly defined rights and complete information can support the efficient outcome regardless of initial rights. The distribution of gains still depends on those rights. Transaction costs can prevent agreement.'}</p></div>`}
function formulaPanel(k){let f=modelEquations(k);if(!f)return '';return `<details class="learning"><summary><strong>∑ ${lang==='fr'?'Comment ce résultat est-il calculé ?':'How is this result calculated?'}</strong></summary><pre class="formula">${esc(f)}</pre><p class="tiny">${lang==='fr'?'Modèle linéaire stylisé. Quantités continues, agents rationnels, autres facteurs constants.':'Stylized linear model. Continuous quantities, rational agents, all else held constant.'}</p></details>`}
function experimentView(s){let base=coreExperimentView(s);let k=s.kind;let extra=comparePanel(k)+formulaPanel(k)+(k==='coase'?coaseExtension():'');if(k==='commons'){let effort=vals[0],stock=200,regen=50;let cells=[];for(let i=0;i<7;i++){cells.push(`<tr><td>${i}</td><td>${fmt(stock)}</td><td>${fmt(Math.min(stock,effort*10))}</td></tr>`);stock=Math.max(0,stock-Math.min(stock,effort*10)+regen)}extra+=`<details class="learning"><summary><strong>${lang==='fr'?'Voir les sept périodes de pêche':'See seven fishing periods'}</strong></summary><table style="width:100%;text-align:left"><thead><tr><th>${lang==='fr'?'Période':'Period'}</th><th>${lang==='fr'?'Stock au début':'Starting stock'}</th><th>${lang==='fr'?'Captures possibles':'Possible catch'}</th></tr></thead><tbody>${cells.join('')}</tbody></table><p class="tiny">${lang==='fr'?'Tableau complémentaire : les captures sont limitées au stock disponible ; reproduction constante. La visualisation initiale conserve son hypothèse linéaire simplifiée.':'Supplementary table: catches cannot exceed available stock; constant reproduction. The original visualization retains its simple linear assumption.'}</p></details>`}
if(k==='lemons'){let share=vals[0],price=300+6*share;extra+=`<div class="learning"><h4>${lang==='fr'?'Avant / après une garantie crédible':'Before / after a credible warranty'}</h4><div class="comparison"><div><b>${lang==='fr'?'Qualité non observable':'Unobservable quality'}</b>${lang==='fr'?'Prix fondé sur la qualité moyenne':'Price based on average quality'} : ${money(price)}</div><div><b>${lang==='fr'?'Qualité vérifiée':'Verified quality'}</b>${lang==='fr'?'Les bons appareils peuvent être identifiés et évalués jusqu’à':'Good devices can be identified and valued up to'} 900 €</div></div><p class="tiny">${lang==='fr'?'Une garantie ou certification crédible peut réduire l’asymétrie, mais son coût et sa fiabilité importent.':'Credible warranties or certification can reduce asymmetry, but their cost and reliability matter.'}</p></div>`}
if(k==='moral'){let audit=vals[0];extra+=`<div class="learning"><h4>${lang==='fr'?'Avant / après contrôle':'Before / after monitoring'}</h4><div class="comparison"><div><b>${lang==='fr'?'Sans audit':'Without audit'}</b>${lang==='fr'?'Pénalité attendue : 0 €':'Expected penalty: €0'}</div><div><b>${lang==='fr'?'Avec audit':'With audit'}</b>${lang==='fr'?'Pénalité attendue':'Expected penalty'} : ${money(audit*5)}</div></div><p class="tiny">${lang==='fr'?'La décision de fournir l’effort dépend aussi de la valeur de la relation commerciale, des sanctions et des coûts du contrôle, non modélisés ici.':'Effort also depends on relationship value, sanctions and monitoring costs, not modeled here.'}</p></div>`}
if(k==='network'){extra+=`<div class="learning"><h4>${lang==='fr'?'Testez un effet de réseau':'Test a network effect'}</h4><p>${lang==='fr'?'À technologie identique, faites passer la part de la plateforme A de 50 % à 80 % et observez l’écart d’utilité. Une plateforme dominante n’est pas automatiquement abusive.':'Holding technology constant, change platform A’s share from 50% to 80% and observe the utility gap. Dominance is not automatically abusive.'}</p><div class="tabs"><button onclick="adjust(0,50)">50 / 50</button><button onclick="adjust(0,80)">80 / 20</button><button onclick="adjust(0,20)">20 / 80</button></div></div>`}
return base+extra}
const caseExplanations={fr:['Les dommages imposés aux riverains ne sont pas inclus dans les coûts privés : externalité négative.','La digue protège même ceux qui ne paient pas : problème de passager clandestin associé au bien public.','Le vendeur dispose d’une information privée avant la transaction : risque de sélection adverse.','La capacité de restreindre la quantité et d’augmenter le prix traduit un pouvoir de marché.','L’accès non contrôlé à une ressource rivale favorise la surexploitation : tragédie des ressources communes.','Après la signature, l’effort du prestataire est difficile à observer : aléa moral.'],en:['Harms to residents are excluded from private costs: negative externality.','The flood barrier protects non-payers too: free riding associated with a public good.','The seller has private information before the trade: adverse selection risk.','Restricting output and raising price reflects market power.','Uncontrolled access to a rival resource can cause overuse: common-resource problem.','After signing, the contractor’s effort is hard to observe: moral hazard.']};
function finalView(){let html=coreFinalView();let labels=families.map(f=>f[lang]);if(quizAt>=finalCases.length){let score=finalCases.reduce((n,c,i)=>n+(quizAnswers[i]===c.a?1:0),0);let detail=`<section class="panel" id="revision"><h2>${lang==='fr'?'Fiche personnelle de révision':'Personal revision sheet'}</h2><p>${lang==='fr'?'Diagnostic des six situations, avec justification :':'Six diagnoses with explanations:'}</p>${finalCases.map((c,i)=>`<div class="mini" style="margin:9px 0"><b>${i+1}. ${esc(c[lang])}</b><p>${lang==='fr'?'Votre réponse':'Your answer'} : ${quizAnswers[i]===undefined?'—':esc(labels[quizAnswers[i]])} ${quizAnswers[i]===c.a?'✓':'✗'}</p><p><strong>${esc(labels[c.a])}</strong> — ${esc(caseExplanations[lang][i])}</p></div>`).join('')}<h3>${lang==='fr'?'Les quatre questions à retenir':'Four questions to remember'}</h3>${families.map(f=>`<p><b>${esc(f[lang])} :</b> ${esc(familyQuestions[f.id][lang==='fr'?0:1])}</p>`).join('')}<div class="summary-actions"><button class="btn" onclick="window.print()">🖨 ${lang==='fr'?'Imprimer / enregistrer en PDF':'Print / save as PDF'}</button><button class="btn secondary" onclick="downloadRevision()">↓ ${lang==='fr'?'Télécharger ma fiche (.txt)':'Download my notes (.txt)'}</button></div></section>`;return html+detail}return html.replace('</section>',`<p class="tiny">${lang==='fr'?'Après validation, vous découvrirez pourquoi la réponse est correcte.':'After checking, you will see why the answer is correct.'}</p></section>`).replace(/(<div class="feedback[^>]*>)([\s\S]*?)(<\/div>)/,(m,a,b,c)=>quizChecked?a+b+`<p>${esc(caseExplanations[lang][quizAt])}</p>`+c:m)}
function downloadRevision(){let lines=[lang==='fr'?'EFREI — Fiche de révision : défaillances du marché':'EFREI — Market failures revision notes'];lines.push((lang==='fr'?'Score : ':'Score: ')+finalCases.reduce((n,c,i)=>n+(quizAnswers[i]===c.a?1:0),0)+' / '+finalCases.length);finalCases.forEach((c,i)=>lines.push(`${i+1}. ${c[lang]}\n${families[c.a][lang]} — ${caseExplanations[lang][i]}`));families.forEach(f=>lines.push(`${f[lang]} — ${familyQuestions[f.id][lang==='fr'?0:1]}`));let blob=new Blob([lines.join('\n\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='EFREI_fiche_revision_defaillances_marche.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
// Decorate the chart with a visual welfare-loss wedge; keep original curve labels once.
const originalMarketGraph=baseMarketGraph;
function marketGraph(kind){let g=originalMarketGraph(kind),d=vals[0],tax=vals[1],positive=kind==='positive';let q1=positive?120/14:(120-tax)/14,q2=positive?(120+d)/14:(120-d)/14;
let x=q=>52+q*22,y=v=>250-v*1.45;let dfn=q=>140-8*q,privateCost=q=>20+6*q;
let qlo=Math.min(q1,q2),qhi=Math.max(q1,q2);if(qhi-qlo>.001){let vStart=positive?privateCost(q1):dfn(q1),vEnd=positive?dfn(q1)+d:privateCost(q1)+d;let points=positive?`${x(q1)},${y(privateCost(q1))} ${x(q1)},${y(dfn(q1)+d)} ${x(q2)},${y(privateCost(q2))}`:`${x(q1)},${y(dfn(q1))} ${x(q1)},${y(privateCost(q1)+d)} ${x(q2)},${y(dfn(q2))}`;let overlay=`<polygon points="${points}" fill="#e9a33c" fill-opacity=".23" stroke="#ce861e" stroke-dasharray="3 3" stroke-width="1.2"/>`;g.chart=g.chart.replace('<line x1="52"',overlay+'<line x1="52"');}
let labels=`<div class="legend"><span><i class="dot" style="background:#087f77"></i>${lang==='fr'?'● Quantité observée / après intervention':'● Observed / policy output'}</span><span><i class="dot" style="background:#d34b5c"></i>${lang==='fr'?'● Quantité socialement optimale':'● Socially optimal output'}</span><span><i class="dot" style="background:#e9a33c"></i>${lang==='fr'?'Zone orange : perte sèche':'Orange area: deadweight loss'}</span></div>`;
g.chart+=labels;return g}
